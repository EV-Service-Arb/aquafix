# Generated by v_flakes `figma` (`github` or `workflows`). Needs the secrets FIGMA_OAUTH (evinvest-figma-render's oauth.json) and
# FIGMA_TOKEN (a Figma personal access token with folders:read), and the variable FIGMA_FOLDER (a Figma folder URL).
concurrency:
  cancel-in-progress: false
  group: figma
jobs:
  render:
    if: github.event_name != 'issue_comment' || (contains(github.event.comment.body, '[figma]') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    name: render into Figma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
      - name: Lean cache setup
        run: |
          mkdir -p /tmp/nix-lean-cache
          chmod 0777 /tmp/nix-lean-cache
          printf '#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true" $OUT_PATHS || true\n' > /tmp/nix-lean-pbh.sh
          chmod 0755 /tmp/nix-lean-pbh.sh
        shell: bash
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = true
            post-build-hook = /tmp/nix-lean-pbh.sh
            extra-substituters = file:///tmp/nix-lean-cache
            extra-trusted-substituters = file:///tmp/nix-lean-cache
            require-sigs = false
      - if: github.ref_name != github.event.repository.default_branch
        name: Restore lean nix cache
        uses: actions/cache/restore@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - if: github.ref_name == github.event.repository.default_branch
        name: Lean nix cache (built-only paths)
        uses: actions/cache@v5
        with:
          key: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          path: /tmp/nix-lean-cache
          restore-keys: nix-lean-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - env:
          FIGMA_FOLDER: ${{ vars.FIGMA_FOLDER }}
          FIGMA_OAUTH: ${{ secrets.FIGMA_OAUTH }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        name: Render
        run: |
          for v in FIGMA_OAUTH FIGMA_TOKEN FIGMA_FOLDER; do [ -n "${!v}" ] || { echo "::error::$v is unset"; exit 1; }; done
          state="${XDG_STATE_HOME:-$HOME/.local/state}/evinvest-figma-render"
          mkdir -p "$state"
          printf '%s' "$FIGMA_OAUTH" > "$state/oauth.json"
          status=0 # a render with uncaptured frames still prints its link
          nix run .#figma -- --folder "$FIGMA_FOLDER" --name "${{ github.event.repository.name }}" > "$RUNNER_TEMP/link" || status=$?
          cat "$RUNNER_TEMP/link"
          echo "Figma: $(cat "$RUNNER_TEMP/link")" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
name: Figma
on:
  issue_comment:
    types:
      - created
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch: {}
permissions:
  contents: read
